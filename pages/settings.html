<section class="grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">

    <!-- Bloc catégories -->
    <div class="bg-white p-6 rounded-xl dark:bg-slate-800 shadow-sm flex flex-col justify-between">
        <div class="space-y-6">
            <h1 class="text-2xl ml-4 transition-colors duration-600">Choose the categories you will use</h1>

            <!-- Toggle Switch (Expense / Income) -->
            <div class="flex bg-gray-100 dark:bg-slate-700 p-1 rounded-lg transition-all duration-300">
                <button type="button" id="btnExpense"
                    class="w-full py-2 text-sm font-semibold rounded-md bg-red-500 text-white transition-all shadow-sm">
                    Expense
                </button>
                <button type="button" id="btnIncome"
                    class="w-full py-2 text-sm font-semibold rounded-md text-gray-500 dark:text-gray-400 transition-all">
                    Income
                </button>
            </div>

            <!-- Liste des catégories -->
            <ul id="categoriesUl"
                class="divide-y divide-gray-200 dark:divide-slate-700 border-t border-b border-gray-200 dark:border-slate-700">
            </ul>

            <!-- Formulaire d'ajout -->
            <form id="addCategoryForm" class="flex gap-2">
                <input type="text" id="newCategoryIcon" placeholder="🙂" maxlength="2"
                    class="w-14 text-center px-2 py-2 rounded-lg border border-gray-300 dark:border-slate-600 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                <input type="text" id="newCategoryInput" placeholder="Nouvelle catégorie"
                    class="flex-1 px-3 py-2 rounded-lg border border-gray-300 dark:border-slate-600 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
                <button type="submit" id="addCategoryBtn"
                    class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm font-semibold hover:bg-red-600 transition-colors">
                    Ajouter
                </button>
            </form>
        </div>
    </div>

    <!-- Bloc paramètres -->
    <div class="bg-white p-6 rounded-xl dark:bg-slate-800 shadow-sm flex flex-col justify-between">
        <div class="space-y-6">
            <h1 class="text-2xl ml-4">Paramètres</h1>

            <div class="space-y-2">
                <label for="nicknameInput" class="block text-sm font-semibold text-slate-600 dark:text-slate-300 ml-1">
                    Your Name / You Nickname
                </label>
                <input type="text" id="nicknameInput" placeholder="E.g: Nix"
                    class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-slate-600 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
            </div>

            <p id="settingsPreview" class="text-sm text-gray-400 italic ml-1"></p>

            <div class="space-y-2">
                <label for="budgetInput" class="block text-sm font-semibold text-slate-600 dark:text-slate-300 ml-1">
                    Monthly Budget
                </label>
                <input type="number" id="budgetInput" placeholder="e.g. 1000" min="0"
                    class="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-slate-600 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
            </div>

            <div class="pt-4 border-t border-gray-200 dark:border-slate-700">
                <button type="button" id="resetAppBtn"
                    class="w-full py-3 bg-gray-100 dark:bg-slate-700 text-red-500 font-bold rounded-xl hover:bg-red-50 dark:hover:bg-slate-600 transition-colors">
                    Reset app
                </button>
                <p class="text-xs text-gray-400 mt-2 ml-1">Reset the app and clear all data.</p>
            </div>
        </div>
    </div>

</section>
