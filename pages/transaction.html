<section class="max-w-md">
    <form id="transactionForm" class="flex flex-col gap-3 bg-white p-4 rounded-xl dark:bg-slate-800">
        <input type="text" id="txLabel" placeholder="Libellé"
            class="border rounded-lg px-3 py-2 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
        <input type="number" id="txAmount" placeholder="Montant"
            class="border rounded-lg px-3 py-2 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100">
        <button type="submit" class="bg-blue-900 text-white rounded-lg px-3 py-2 hover:cursor-pointer dark:bg-sky-500">
            Ajouter
        </button>
    </form>
    <ul id="txList" class="mt-4 flex flex-col gap-2"></ul>
</section>
