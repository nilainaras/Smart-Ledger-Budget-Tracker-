<section class="grid grid-cols-1 lg:grid-cols-2 gap-6 p-6">
    <div class="bg-white p-6 rounded-xl dark:bg-slate-800 shadow-sm flex flex-col justify-between">
        <form id="transactionForm" class="space-y-6">
            <!-- Toggle Switch (Expense / Income) -->
            <div class="flex bg-gray-100 dark:bg-slate-700 p-1 rounded-lg transition-all duration-300">
                <button type="button" id="btnExpense"
                    class="w-full py-2 text-sm font-semibold rounded-md bg-red-500 text-white transition-all shadow-sm">
                    Expense
                </button>
                <button type="button" id="btnIncome"
                    class="w-full py-2 text-sm font-semibold rounded-md text-gray-500 dark:text-gray-400 transition-all">
                    Income
                </button>
            </div>

            <!-- Amount Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Amount
                    ($)</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 font-bold">$</span>
                    <input type="number" id="amountInput" step="0.01" placeholder="0.00" required
                        class="w-full pl-9 pr-4 py-3 bg-gray-50 dark:bg-slate-900 border-0 rounded-xl font-bold text-xl text-slate-800 dark:text-white focus:ring-2 focus:ring-red-500 outline-none">
                </div>
            </div>

            <!-- Interactive Category Pills -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Select
                    Category</label>
                <!-- Container changed dynamically by JS -->
                <div id="categoriesGrid" class="grid grid-cols-3 gap-2"></div>
            </div>

            <!-- Optional Note/Description -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Description
                    (Optional)</label>
                <input type="text" id="descriptionInput" placeholder="e.g., Walmart groceries, Monthly salary..."
                    class="w-full px-4 py-3 bg-gray-50 dark:bg-slate-900 border-0 rounded-xl text-sm text-slate-800 dark:text-white focus:ring-2 focus:ring-red-500 outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full py-3 bg-red-500 text-white font-bold rounded-xl shadow-md hover:bg-red-600 transition-colors">
                Save Expense
            </button>
        </form>
    </div>

    <div class="space-y-6">
        <!-- Div 1: Recent Incomes -->
        <div class="bg-white p-6 rounded-xl dark:bg-slate-800 shadow-sm min-h-55">
            <div class="flex items-center justify-between mb-4 border-b border-gray-100 dark:border-slate-700 pb-2">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Recent Incomes</h3>
                <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">Top 5</span>
            </div>
            <ul id="recentIncomesList" class="space-y-3 division-y-0">
                <!-- Injected via JS -->
            </ul>
        </div>

        <!-- Div 2: Recent Expenses -->
        <div class="bg-white p-6 rounded-xl dark:bg-slate-800 shadow-sm min-h-55">
            <div class="flex items-center justify-between mb-4 border-b border-gray-100 dark:border-slate-700 pb-2">
                <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider">Recent Expenses</h3>
                <span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-semibold">Top 5</span>
            </div>
            <ul id="recentExpensesList" class="space-y-3 division-y-0">
                <!-- Injected via JS -->
            </ul>
        </div>

    </div>
</section>
